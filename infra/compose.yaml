
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-speaking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_speaking
      POSTGRES_USER: speaking
      POSTGRES_PASSWORD: speaking_local_dev

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U speaking -d ai_speaking
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
